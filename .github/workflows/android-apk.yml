name: G2 Dash - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, test/v058-reviewed-apk]
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'brand.css'
      - 'widgets.css'
      - 'media.css'
      - 'adaptive.css'
      - 'intro.css'
      - 'intro.js'
      - 'ibiza360.css'
      - 'ibiza360.js'
      - 'apps.css'
      - 'apps.js'
      - 'music-detail.css'
      - 'music-detail.js'
      - 'airplay.css'
      - 'airplay.js'
      - 'ibiza-cutout.css'
      - 'app.js'
      - 'touch-studio.css'
      - 'touch-studio.js'
      - 'layout-controls.css'
      - 'layout-controls.js'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify v0.5.8 sources
        run: |
          test -s index.html
          test -s intro.js
          test -s app.js
          test -s touch-studio.js
          test -s touch-studio.css
          test -s layout-controls.js
          test -s layout-controls.css
          test -s android/app/build.gradle
          grep -q "versionName '0.5.8-dev'" android/app/build.gradle
      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G2-Dash-v0.5.8-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
