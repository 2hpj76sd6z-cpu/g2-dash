name: G2 Dash - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, test/v058-reviewed-apk]
    paths:
      - 'android/**'
      - 'index.html'
      - 'style.css'
      - 'brand.css'
      - 'widgets.css'
      - 'media.css'
      - 'adaptive.css'
      - 'intro.css'
      - 'intro.js'
      - 'ibiza360.css'
      - 'ibiza360.js'
      - 'apps.css'
      - 'apps.js'
      - 'music-detail.css'
      - 'music-detail.js'
      - 'airplay.css'
      - 'airplay.js'
      - 'ibiza-cutout.css'
      - 'app.js'
      - 'touch-studio.css'
      - 'touch-studio.js'
      - 'layout-controls.css'
      - 'layout-controls.js'
      - 'map-widget.js'
      - 'scripts/check-shared-media.mjs'
      - 'scripts/check-android-view.mjs'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify v0.5.8 sources
        run: |
          test -s index.html
          test -s intro.js
          test -s app.js
          test -s touch-studio.js
          test -s touch-studio.css
          test -s layout-controls.js
          test -s layout-controls.css
          test -s android/app/build.gradle
          grep -q "versionName '0.5.8-dev'" android/app/build.gradle
      - name: Verificar recepciÃƒÂ³n de GPS del telÃƒÂ©fono
        run: |
          mkdir -p "$RUNNER_TEMP/nmea"
          androidjar="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -cp "$androidjar" -d "$RUNNER_TEMP/nmea" android/app/src/main/java/com/dobleg/g2dash/PhoneGps.java scripts/CheckPhoneGps.java
          java -cp "$RUNNER_TEMP/nmea:$androidjar" com.dobleg.g2dash.CheckPhoneGps
      - name: Build debug APK
        env:
          G2_TEST_RECEIVER: '1'
        run: gradle -p android --no-daemon :app:assembleDebug :receiver:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: receptor-solo-para-pruebas
          path: android/receiver/build/outputs/apk/debug/receiver-debug.apk
      - name: Verificar firma, launcher y recursos empacados
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/g2-package.txt"
          grep -F "package: name='com.dobleg.g2dash.prueba23' versionCode='23'" "$RUNNER_TEMP/g2-package.txt"
          grep -F "launchable-activity: name='com.dobleg.g2dash.MainActivity'" "$RUNNER_TEMP/g2-package.txt"
          for asset in index.html layout-controls.css map-widget.js app.js assets/ibiza_frente_sin_fondo.webp assets/ibiza_trasera_sin_fondo.png assets/seat_emblema_oficial.svg; do
            unzip -p "$apk" "assets/www/$asset" | cmp - "$asset"
          done
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G2-Dash-v0.5.8-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  stereo:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: G2-Dash-v0.5.8-Android-debug
      - uses: actions/download-artifact@v4
        with:
          name: receptor-solo-para-pruebas
      - uses: android-actions/setup-android@v4
      - name: Arrancar el launcher en Android e instalar la APK entregada
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          sdkmanager "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64"
          echo no | avdmanager create avd -n dash -k "system-images;android-30;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd dash -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for n in $(seq 1 150); do
            if adb shell getprop sys.boot_completed | grep -q 1; then break; fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell input keyevent 82
          adb shell wm density 160
          adb shell wm size 480x800
          adb shell wm dismiss-keyguard
          adb install -g app-debug.apk
          python3 -u scripts/gps-emulator.py >"$RUNNER_TEMP/gps.log" 2>&1 &
          pkg=com.dobleg.g2dash.prueba23
          adb shell run-as "$pkg" mkdir -p shared_prefs
          printf '%s' '<map><boolean name="shareTurns" value="true"/><string name="carlinkApp">com.dobleg.testreceiver</string><string name="gpsHost">10.0.2.2</string><int name="gpsPort" value="31123"/></map>' > "$RUNNER_TEMP/gps.xml"
          adb shell "run-as $pkg sh -c 'cat > shared_prefs/com.dobleg.g2dash.MainActivity.xml'" < "$RUNNER_TEMP/gps.xml"
          adb install receiver-debug.apk
          adb shell cmd notification allow_listener "$pkg/com.dobleg.g2dash.G2MediaListener"
          # Allow the Android notification manager to bind the listener before posting both fixture notifications.
          for n in $(seq 1 20); do
            if adb shell dumpsys notification | grep -F 'com.dobleg.g2dash.prueba23/com.dobleg.g2dash.G2MediaListener' > /dev/null; then break; fi
            sleep 1
          done
          adb shell am start -W -n com.dobleg.testreceiver/.ReceiverActivity
          adb shell am start -W -n com.dobleg.g2dash.prueba23/com.dobleg.g2dash.MainActivity
          adb emu geo fix -99.1332 19.4326
          sleep 42
          adb shell pidof com.dobleg.g2dash.prueba23
          adb shell dumpsys activity activities | grep -E 'mResumedActivity.*com.dobleg.g2dash.prueba23'
          pid=$(adb shell pidof com.dobleg.g2dash.prueba23 | tr -d '\r')
          adb forward tcp:9222 localabstract:webview_devtools_remote_$pid
          adb exec-out screencap -p > inicio-android.png
          node scripts/check-android-view.mjs
          node scripts/check-shared-media.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G2-Dash-inicio-Android
          path: |
            inicio-android.png
            tablero-compartido.png
            reproductor-compartido.png
            ruta-en-dash.png
            portada-catalogo.png
