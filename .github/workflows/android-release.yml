name: G² Dash · Publicar APK de Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate tag and signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.G2DASH_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.G2DASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.G2DASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.G2DASH_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version tag such as v0.5.6"
            exit 1
          fi
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure the four G2DASH signing secrets before publishing."
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.G2DASH_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.G2DASH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.G2DASH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.G2DASH_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/g2dash-release.jks"
          echo "G2DASH_KEYSTORE_FILE=$RUNNER_TEMP/g2dash-release.jks" >> "$GITHUB_ENV"
          echo "G2DASH_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "G2DASH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "G2DASH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: >-
          gradle -p android --no-daemon
          -Pg2VersionName="$VERSION"
          -Pg2VersionCode="$VERSION_CODE"
          :app:assembleRelease

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: G² Dash v${{ env.VERSION }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
