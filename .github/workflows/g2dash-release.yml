name: G² Dash · Publicar APK firmado

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate tag and decode signing key
        env:
          G2_SIGNING_KEYSTORE_BASE64: ${{ secrets.G2_SIGNING_KEYSTORE_BASE64 }}
          G2_SIGNING_STORE_PASSWORD: ${{ secrets.G2_SIGNING_STORE_PASSWORD }}
          G2_SIGNING_KEY_ALIAS: ${{ secrets.G2_SIGNING_KEY_ALIAS }}
          G2_SIGNING_KEY_PASSWORD: ${{ secrets.G2_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a stable version tag such as v0.6.0."
            exit 1
          fi
          if [[ -z "$G2_SIGNING_KEYSTORE_BASE64" || -z "$G2_SIGNING_STORE_PASSWORD" || -z "$G2_SIGNING_KEY_ALIAS" || -z "$G2_SIGNING_KEY_PASSWORD" ]]; then
            echo "Add all four G2_SIGNING_* repository Actions secrets before publishing."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$version"
          version_code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if (( version_code <= 15 )); then
            echo "The release version code must be greater than the current debug APK."
            exit 1
          fi
          printf '%s' "$G2_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/g2dash-release.jks"
          echo "G2_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "G2_RELEASE_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "G2_SIGNING_STORE_FILE=$RUNNER_TEMP/g2dash-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          G2_SIGNING_STORE_PASSWORD: ${{ secrets.G2_SIGNING_STORE_PASSWORD }}
          G2_SIGNING_KEY_ALIAS: ${{ secrets.G2_SIGNING_KEY_ALIAS }}
          G2_SIGNING_KEY_PASSWORD: ${{ secrets.G2_SIGNING_KEY_PASSWORD }}
        run: |
          gradle -p android --no-daemon :app:assembleRelease \
            -Pg2ReleaseVersionCode="$G2_RELEASE_VERSION_CODE" \
            -Pg2ReleaseVersionName="$G2_RELEASE_VERSION"

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/G2-Dash.apk
          gh release create "$GITHUB_REF_NAME" dist/G2-Dash.apk \
            --title "G² Dash v$G2_RELEASE_VERSION" --generate-notes
