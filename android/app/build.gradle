plugins {
    id 'com.android.application'
}

def googleMapsApiKey = System.getenv("GOOGLE_MAPS_API_KEY") ?: ""
def escapedGoogleMapsApiKey = googleMapsApiKey.replace("\\", "\\\\").replace("\"", "\\\"")

android {
    namespace 'com.dobleg.g2dash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dobleg.g2dash'
        minSdk 23
        targetSdk 35
        versionCode 18
        versionName '0.5.8-dev'
        buildConfigField "String", "GOOGLE_MAPS_API_KEY", "\"${escapedGoogleMapsApiKey}\""
        manifestPlaceholders = [GOOGLE_MAPS_API_KEY: googleMapsApiKey]
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Reuse the SAME approved dashboard files used by GitHub Pages.
    // Generated in build/, without copying photos into Git history twice.
    sourceSets {
        main {
            assets.srcDirs("$buildDir/generated/g2web")
        }
    }
}

tasks.register('bundleG2Web', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css', 'brand.css', 'widgets.css', 'ibiza-cutout.css', 'media.css', 'adaptive.css', 'intro.css', 'intro.js', 'ibiza360.css', 'ibiza360.js', 'apps.css', 'apps.js', 'music-detail.css', 'music-detail.js', 'airplay.css', 'airplay.js', 'app.js', 'touch-studio.css', 'touch-studio.js', 'layout-controls.css', 'layout-controls.js', 'assets/**'
    }
    into(layout.buildDirectory.dir('generated/g2web/www'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('bundleG2Web'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
}
