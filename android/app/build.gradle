plugins {
    id 'com.android.application'
}

def g2VersionName = project.findProperty("g2VersionName") ?: "0.5.5-dev"
def g2VersionCode = (project.findProperty("g2VersionCode") ?: "15").toInteger()

def releaseStoreFile = System.getenv("G2DASH_KEYSTORE_FILE")
def releaseStorePassword = System.getenv("G2DASH_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("G2DASH_KEY_ALIAS")
def releaseKeyPassword = System.getenv("G2DASH_KEY_PASSWORD")

android {
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    namespace 'com.dobleg.g2dash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dobleg.g2dash'
        minSdk 23
        targetSdk 35
        versionCode g2VersionCode
        versionName g2VersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Reuse the SAME approved dashboard files used by GitHub Pages.
    // Generated in build/, without copying photos into Git history twice.
    sourceSets {
        main {
            assets.srcDirs("$buildDir/generated/g2web")
        }
    }
}

tasks.register('bundleG2Web', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css', 'brand.css', 'widgets.css', 'ibiza-cutout.css', 'media.css', 'adaptive.css', 'intro.css', 'intro.js', 'ibiza360.css', 'ibiza360.js', 'apps.css', 'apps.js', 'music-detail.css', 'music-detail.js', 'airplay.css', 'airplay.js', 'app.js', 'assets/**'
    }
    into(layout.buildDirectory.dir('generated/g2web/www'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('bundleG2Web'))
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.webkit:webkit:1.14.0'
}
