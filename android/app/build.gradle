plugins {
    id 'com.android.application'
}

def g2VersionCode = (project.findProperty('g2ReleaseVersionCode') ?: '15').toInteger()
def g2VersionName = project.findProperty('g2ReleaseVersionName') ?: '0.5.5-dev'
def g2SigningStoreFile = System.getenv('G2_SIGNING_STORE_FILE')
def g2SigningStorePassword = System.getenv('G2_SIGNING_STORE_PASSWORD')
def g2SigningKeyAlias = System.getenv('G2_SIGNING_KEY_ALIAS')
def g2SigningKeyPassword = System.getenv('G2_SIGNING_KEY_PASSWORD')

android {
    namespace 'com.dobleg.g2dash'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dobleg.g2dash'
        minSdk 23
        targetSdk 35
        versionCode g2VersionCode
        versionName g2VersionName
    }

    signingConfigs {
        release {
            if (g2SigningStoreFile) {
                storeFile file(g2SigningStoreFile)
                storePassword g2SigningStorePassword
                keyAlias g2SigningKeyAlias
                keyPassword g2SigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Reuse the SAME approved dashboard files used by GitHub Pages.
    // Generated in build/, without copying photos into Git history twice.
    sourceSets {
        main {
            assets.srcDirs("$buildDir/generated/g2web")
        }
    }
}

tasks.register('bundleG2Web', Copy) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'style.css', 'brand.css', 'widgets.css', 'ibiza-cutout.css', 'media.css', 'adaptive.css', 'intro.css', 'intro.js', 'ibiza360.css', 'ibiza360.js', 'apps.css', 'apps.js', 'music-detail.css', 'music-detail.js', 'airplay.css', 'airplay.js', 'app.js', 'assets/**'
    }
    into(layout.buildDirectory.dir('generated/g2web/www'))
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('bundleG2Web'))
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
